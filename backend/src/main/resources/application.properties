spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/artbots
spring.datasource.username=swunk
spring.jpa.hibernate.ddl-auto=update
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://dev-zcwjkuoda50t70df.us.auth0.com/

# Where submitted images get written. Created on startup if it isn't there.
artbots.upload-dir=./uploads

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# So a rejected upload's reason actually reaches the browser instead of an
# empty "message" field.
spring.web.error.include-message=always
